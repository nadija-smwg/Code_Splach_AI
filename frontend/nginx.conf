# nginx.conf
# ─────────────────────────────────────────────────────────────
# This config file tells nginx how to serve the React app.
#
# THE KEY PROBLEM WITHOUT THIS FILE:
# React Router uses client-side routing. When a user refreshes
# the page at /discrepancies, nginx looks for a file at
# /discrepancies — which doesn't exist — and returns 404.
#
# THE FIX:
# "try_files $uri $uri/ /index.html" tells nginx:
#   1. Try to find a real file matching the URL.
#   2. If not found, serve index.html instead.
# React then reads the URL and renders the correct screen.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # Root folder where the Vite build output lives
    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router — fall back to index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (JS, CSS, images) for 1 year
    # They get content-hashed filenames so stale cache is not a problem.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
